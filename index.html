<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Football Tracker</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background-color: #0d1117;
                                                            color: #c9d1d9;
                                                                        margin: 0;
                                                                                    padding: 20px;
                                                                                                text-align: center;
                                                                                                        }
                                                                                                                header {
                                                                                                                            background: #161b22;
                                                                                                                                        padding: 15px;
                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                margin-bottom: 20px;
                                                                                                                                                                        }
                                                                                                                                                                                h1 {
                                                                                                                                                                                            color: #58a6ff;
                                                                                                                                                                                                        margin: 0;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                        .match-card {
                                                                                                                                                                                                                                    background: #21262d;
                                                                                                                                                                                                                                                border: 1px solid #30363d;
                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                        padding: 15px;
                                                                                                                                                                                                                                                                                    margin: 10px auto;
                                                                                                                                                                                                                                                                                                max-width: 400px;
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                <header>
                                                                                                                                                                                                                                                                                                                        <h1>Football Tracker</h1>
                                                                                                                                                                                                                                                                                                                                <p>Live matches and fixtures</p>
                                                                                                                                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                                                                                                                                        <main>
                                                                                                                                                                                                                                                                                                                                                <div class="match-card">
                                                                                                                                                                                                                                                                                                                                                            <h3>Matchday 1</h3>
                                                                                                                                                                                                                                                                                                                                                                        <p>Team A vs Team B</p>
                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>Coming Soon</strong></p>
                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                </html>
